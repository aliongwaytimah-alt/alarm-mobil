<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hybrid Car Security</title>
    <style>
        :root { --bg: #0b0f19; --card: #151d30; --cyan: #00f3ff; --red: #ff2a5f; --green: #39ff14; --orange: #ffaa00; --text: #e2e8f0; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; user-select: none; }
        h1 { color: var(--cyan); font-size: 1.4rem; letter-spacing: 2px; margin-top: 10px; margin-bottom: 2px; text-shadow: 0 0 10px rgba(0,243,255,0.3); }
        .status-bar { font-size: 0.8rem; color: #64748b; margin-bottom: 25px; font-weight: bold; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 400px; }
        .btn { background: var(--card); border: 1px solid #24344d; border-radius: 16px; padding: 25px 15px; text-align: center; font-weight: bold; font-size: 1.1rem; color: #fff; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .btn:active { transform: scale(0.95); }
        .btn-lock { border-color: var(--red); color: var(--red); }
        .btn-unlock { border-color: var(--green); color: var(--green); }
        .full { grid-column: span 2; }
        .panel { background: var(--card); border: 1px solid #24344d; border-radius: 16px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .flex { display: flex; gap: 10px; margin-top: 10px; }
        input { width: 60px; background: #0b0f19; border: 1px solid #24344d; color: #fff; border-radius: 8px; padding: 10px; text-align: center; font-size: 1rem; }
        .btn-act { flex: 1; background: var(--cyan); color: #000; border: none; border-radius: 8px; font-weight: bold; height: 42px; cursor: pointer;}
        .btn-danger { background: var(--red); color: #fff; }
        .sub-txt { margin-top: 8px; font-size: 0.8rem; font-weight: normal; }
        .indicator-box { display: flex; justify-content: center; background: #0e1626; padding: 10px; border-radius: 8px; border: 1px solid #1e293b; margin-bottom: 10px;}
        .ind { font-size: 0.85rem; color: #475569; display: flex; align-items: center; gap: 5px; font-weight: bold; }
        .ind.active { color: var(--orange); text-shadow: 0 0 8px var(--orange); }
    </style>
</head>
<body>
    <h1>HYBRID SECURITY</h1>
    <div class="status-bar" id="sys-status">LOADING SYSTEM...</div>
    <div class="grid">
        <div class="btn btn-lock" onclick="sendCmd('lock', 'V1', '1')">🔒 LOCK</div>
        <div class="btn btn-unlock" onclick="sendCmd('unlock', 'V2', '1')">🔓 UNLOCK</div>
        
        <div class="btn full" id="btn-engine" onclick="toggleEngineCmd()">
            🛡️ ENGINE LOCK
            <div class="sub-txt" id="engine-txt">STATUS: AMAN</div>
        </div>
        
        <div class="panel full">
            <div class="indicator-box">
                <div class="ind" id="ind-horn">📢 KLAKSON: OFF</div>
            </div>
            <span style="font-weight:bold; font-size:0.9rem;">🔊 SIRINE + HAZARD BUTTON</span>
            <div class="flex">
                <input type="number" id="sirine-sec" value="1" min="1" max="5">
                <button class="btn-act" onclick="startSirineCmd()">BUNYI</button>
                <button class="btn-act btn-danger" onclick="sendCmd('stop-sirine', 'V5', '0')">OFF</button>
            </div>
        </div>
    </div>
    <script>
        const token = "5ff2l1M-pCyBoowZXZtPCM3lkZgZbLUt";
        const isOnlineMode = window.location.hostname !== "192.168.1.222" && window.location.hostname !== "alarm.local";
        let lastEngineState = false;

        // Logika Pengiriman Perintah Otomatis Deteksi Jaringan (Offline/Online)
        function sendCmd(endpoint, pin, val) {
            if (isOnlineMode) {
                // Lewat jalur Blynk API Cloud (Online Jarak Jauh)
                fetch(`https://blynk.cloud{token}&${pin}=${val}`);
            } else {
                // Lewat jalur Lokal IP Web Server (Offline Dekat Mobil)
                fetch(`/${endpoint}`);
            }
        }

        function toggleEngineCmd() {
            if (isOnlineMode) {
                let nextVal = lastEngineState ? "0" : "1";
                fetch(`https://blynk.cloud{token}&V3=${nextVal}`);
            } else {
                fetch('/toggle-engine');
            }
        }

        function startSirineCmd() {
            let sec = document.getElementById('sirine-sec').value;
            if (isOnlineMode) {
                fetch(`https://blynk.cloud{token}&V4=${sec}`).then(() => {
                    fetch(`https://blynk.cloud{token}&V5=1`);
                });
            } else {
                fetch(`/sirine?sec=${sec}`);
            }
        }

        function updateStatus() {
            let statusURL = isOnlineMode ? `https://blynk.cloud{token}&V1&V2&V3&V4&V5` : '/status';
            
            if (isOnlineMode) {
                // Mengambil umpan balik data dari Server Blynk Cloud untuk mode Online
                fetch(statusURL).then(res => res.json()).then(data => {
                    // Penyesuaian variabel simulasi dari data pin Blynk virtual
                    renderUI(data.V3 == 1, data.V5 == 1, data.V1 == 0); // V1=0 diasumsikan armed setelah ditekan
                }).catch(() => {});
            } else {
                // Mengambil umpan balik data langsung dari modul untuk mode Offline
                fetch(statusURL).then(res => res.json()).then(data => {
                    renderUI(data.engine_locked, data.relay_horn_active, data.sys_armed);
                }).catch(() => {});
            }
        }

        function renderUI(engineLocked, hornActive, sysArmed) {
            const eBtn = document.getElementById('btn-engine');
            const eTxt = document.getElementById('engine-txt');
            const sBar = document.getElementById('sys-status');
            const iHorn = document.getElementById('ind-horn');
            
            lastEngineState = engineLocked;
            sBar.innerText = sysArmed ? "SISTEM AKTIF (SIAGA)" : "SISTEM NON-AKTIF (PERJALANAN)";
            sBar.style.color = sysArmed ? "var(--red)" : "var(--green)";
            
            if (engineLocked) {
                eBtn.style.borderColor = 'var(--red)'; eBtn.style.color = 'var(--red)';
                eTxt.innerText = "STATUS: MESIN DIKUNCI MATI";
            } else {
                eBtn.style.borderColor = '#24344d'; eBtn.style.color = '#fff';
                eTxt.innerText = "STATUS: AMAN (SIAP STARTER)";
            }

            if(hornActive) { iHorn.innerText = "📢 KLAKSON: AKTIF"; iHorn.classList.add('active'); }
            else { iHorn.innerText = "📢 KLAKSON: OFF"; iHorn.classList.remove('active'); }
        }

        setInterval(updateStatus, 1000); 
        updateStatus();
    </script>
</body>
</html>
